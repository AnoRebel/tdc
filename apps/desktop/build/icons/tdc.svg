<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The application's mark: two overlapping conversation bubbles.

    Two rather than one, because this is a place where people talk to each
    other rather than a messaging inbox — the overlap is the point. Drawn as
    solid shapes with a generous corner radius so it survives being scaled to
    16 pixels for a tray, where an outline would turn to mush.

    The colours are the interface's own primary, so the icon and the
    application it opens are recognisably the same thing.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b52ea"/>
      <stop offset="1" stop-color="#4038c4"/>
    </linearGradient>
  </defs>

  <!-- A rounded square rather than a bare glyph: every platform draws an
       application icon on some ground, and supplying our own means it looks
       deliberate rather than cropped. -->
  <rect width="512" height="512" rx="114" fill="url(#ground)"/>

  <!--
    The further bubble, up and to the right, with its tail on the right where
    the nearer one cannot cover it. A bubble whose tail is hidden reads as a
    rounded rectangle, which is not the same shape at all.
  -->
  <path fill="#ffffff" fill-opacity="0.5"
        d="M262 96h134a54 54 0 0 1 54 54v92a54 54 0 0 1-54 54h-6v54l-56-54h-72
           a54 54 0 0 1-54-54v-92a54 54 0 0 1 54-54z"/>

  <!--
    The nearer one, down and to the left, its tail pointing the other way so
    the pair reads as two people talking rather than one stack of messages.
  -->
  <path fill="#ffffff"
        d="M116 226h150a54 54 0 0 1 54 54v96a54 54 0 0 1-54 54h-72l-62 52 8-52h-24
           a54 54 0 0 1-54-54v-96a54 54 0 0 1 54-54z"/>
</svg>
