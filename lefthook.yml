# Git hooks. Installed by "bun install" via the postinstall script.
#
# These run the cheap checks locally so that obvious problems are caught before
# they reach continuous integration. Anything slow belongs in CI, not here: a
# hook that people are tempted to skip is worse than no hook.

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,vue,js,mjs,json,md,yml,yaml}"
      run: bun run prettier --check {staged_files}

    - name: gofmt
      glob: "*.go"
      run: |
        unformatted=$(gofmt -l {staged_files})
        if [ -n "$unformatted" ]; then
          echo "Not gofmt'd:"; echo "$unformatted"; exit 1
        fi

    - name: go vet
      glob: "*.go"
      run: cd server && go vet ./...

    - name: version consistency
      glob: "{VERSION,**/package.json,**/config.yml,**/version.go,**/Info*.plist,**/info.json,**/*.manifest,**/wails_tools.nsh,**/msix/*.xml,**/nfpm.yaml}"
      run: bun run version:check

pre-push:
  parallel: true
  jobs:
    - name: go test
      run: cd server && go test -race -timeout 120s ./...

    - name: go build
      run: cd server && go build ./...

    # Two seconds on a warm cache, beside a test suite that takes far longer.
    # Skipped rather than failed where the tool is not installed: the version
    # is pinned in mise.toml, and somebody who has not run "mise install" yet
    # should be told, not blocked from pushing.
    - name: go lint
      run: |
        if ! command -v golangci-lint >/dev/null 2>&1; then
          echo "golangci-lint is not installed; run 'mise install'. Skipping."
          exit 0
        fi
        cd server && golangci-lint run
