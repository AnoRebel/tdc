# Continuous integration.
#
# Tiered by branch, deliberately. `dev` is where work lands first and where
# people iterate, so it runs the fast checks and gets out of the way. `beta` and
# `main` are what other people run, so they get everything — a slow gate is
# worth it on the branches where a mistake reaches someone else.
name: CI

on:
  push:
    branches: [dev, beta, main]
  pull_request:
    branches: [dev, beta, main]

# A new push supersedes whatever was running for the same branch. Reviewing the
# results of a commit that has already been replaced wastes both minutes and
# attention.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, because a Go release can change vet's rules and turn a green branch
  # red for reasons that have nothing to do with the change under review.
  GO_VERSION: "1.27.0"

jobs:
  # Decides which tier this run is. Expressed once here rather than repeated as
  # a condition on every job, so the rule stays legible.
  tier:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.decide.outputs.full }}
    steps:
      - id: decide
        run: |
          case "${{ github.base_ref || github.ref_name }}" in
            beta|main) echo "full=true"  >> "$GITHUB_OUTPUT" ;;
            *)         echo "full=false" >> "$GITHUB_OUTPUT" ;;
          esac

  web:
    name: Web and shared packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Deliberately unpinned: Bun releases often and stays compatible, and
          # taking the latest means an incompatibility surfaces in a build here
          # rather than months later on a contributor's machine.
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Build the static application
        # The budget measures what a browser downloads, which is the static
        # output rather than the server build above.
        env:
          NUXT_PUBLIC_API_BASE: ""
        run: bun run --cwd apps/web generate

      - name: Initial load stays within budget
        run: bun run budget
        working-directory: apps/web

  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    # Needs the database the server runs against, since almost nothing in this
    # application is reachable without signing in.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tdc
          POSTGRES_PASSWORD: tdc
          POSTGRES_DB: tdc
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Build the application
        # Empty, so the built application calls the host it is served from
        # rather than the address a developer's machine uses.
        env:
          NUXT_PUBLIC_API_BASE: ""
        run: bun run --cwd apps/web generate

      - name: Cache the browser
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('bun.lock') }}

      - name: Install the browser
        # Only when the cache missed: it is a hundred megabytes, and these
        # checks are worth having on every run rather than only when cheap.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx --bun playwright install --with-deps chromium
        working-directory: apps/web

      - name: Serve the application
        env:
          TDC_DATABASE_URL: postgres://tdc:tdc@127.0.0.1:5432/tdc?sslmode=disable
          TDC_SERVER_WEB_ROOT: ${{ github.workspace }}/apps/web/.output/public
          TDC_SERVER_ADDRESS: 127.0.0.1:8099
        run: |
          go build -o /tmp/tdc-server ./cmd/tdc-server
          /tmp/tdc-server &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/api/server >/dev/null && break
            sleep 1
          done
        working-directory: server

      - name: Prepare an account to sign in with
        run: |
          curl -sf -X POST http://127.0.0.1:8099/api/setup             -H 'Content-Type: application/json'             -d '{"username":"founder","password":"correct horse battery staple"}'
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8099/api/auth/signin             -H 'Content-Type: application/json'             -d '{"username":"founder","password":"correct horse battery staple"}'             | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -sf -X POST http://127.0.0.1:8099/api/rooms             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -d '{"slug":"general","name":"General","topic":"A channel to look at"}'

      - name: Check
        run: bun run test:a11y
        working-directory: apps/web

      - name: Keep what a failure produced
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-failures
          path: apps/web/test-results/
          retention-days: 7

  server:
    name: Server
    runs-on: ubuntu-latest

    services:
      # The Debian image rather than Alpine, matching production: musl's
      # collation differs from glibc's, and a test that passes here and fails
      # there is worse than no test.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tdc
          POSTGRES_PASSWORD: tdc
          POSTGRES_DB: tdc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tdc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TDC_TEST_DATABASE_URL: postgres://tdc:tdc@127.0.0.1:5432/tdc?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Formatting
        working-directory: server
        run: |
          # gofmt reports rather than exits non-zero, so the check has to be
          # explicit or a badly formatted file passes silently.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Test
        working-directory: server
        run: go test -race ./...

      - name: Build
        working-directory: server
        run: go build ./...

  desktop:
    name: Desktop
    # Full tier only. It compiles a webview application against GTK and
    # WebKit, which is several minutes of apt on every run — too slow to sit
    # in front of every push to dev, and the thing it guards (an embed
    # directive) changes rarely.
    needs: tier
    if: needs.tier.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/desktop/go.sum

      - name: Install the webview's dependencies
        # What Wails links against on Linux. Named rather than pulled in by a
        # setup action so an upgrade is somebody's decision.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - run: bun install --frozen-lockfile

      - name: The generated bindings are current
        # They are committed so a checkout builds without the CLI, which means
        # they can also be committed stale. Regenerating and finding a diff is
        # the only way to notice.
        run: |
          go run github.com/wailsapp/wails/v3/cmd/wails3 generate bindings -ts -i
          go generate ./internal/shell
          if ! git diff --quiet -- frontend/bindings frontend/app/lib/menu-events.ts; then
            echo "The generated bindings are out of date. Regenerate and commit:"
            echo "  wails3 generate bindings -ts -i"
            echo "  go generate ./internal/shell"
            git diff --stat -- frontend/bindings frontend/app/lib/menu-events.ts
            exit 1
          fi
        working-directory: apps/desktop

      - name: Build the frontend
        # Before the Go build, which embeds its output. Without this the embed
        # directive has no directory to read and the compile fails outright —
        # which is the right failure, just an unhelpfully worded one.
        run: bun run --cwd apps/desktop/frontend build

      - name: Formatting
        working-directory: apps/desktop
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: apps/desktop
        run: go vet ./...

      - name: Test
        # Checks that the built frontend actually reached the binary, which a
        # successful build does not.
        working-directory: apps/desktop
        run: go test ./...

      - name: Build
        working-directory: apps/desktop
        run: go build ./...

  # The heavier checks, on the branches other people actually run.
  licences:
    name: Licence audit
    needs: tier
    if: needs.tier.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Check Go dependency licences
        run: |
          # AGPL in the default path would make this impossible to self-host
          # freely, which is the whole premise. An operator may still choose an
          # AGPL service to run alongside; that is different from linking one.
          #
          # Both modules, not only the server: the desktop client links a
          # keychain library and its transitive dependencies, which is exactly
          # where something restricted would arrive unnoticed.
          go install github.com/google/go-licenses@latest
          (cd server && go-licenses check ./... --disallowed_types=forbidden,restricted)
          (cd apps/desktop && go-licenses check ./... --disallowed_types=forbidden,restricted)

  vulnerabilities:
    name: Vulnerability scan
    needs: tier
    if: needs.tier.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: govulncheck
        working-directory: server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  migrations:
    name: Migrations apply cleanly
    needs: tier
    if: needs.tier.outputs.full == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tdc
          POSTGRES_PASSWORD: tdc
          POSTGRES_DB: tdc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tdc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Apply every migration from empty
        working-directory: server
        env:
          TDC_TEST_DATABASE_URL: postgres://tdc:tdc@127.0.0.1:5432/tdc?sslmode=disable
        run: |
          # A migration that only works against the schema its author happened
          # to have is the classic way an upgrade breaks for everyone else. The
          # test applies the whole sequence to an empty database, then applies
          # it again to check the runner is idempotent.
          go test ./internal/db/ -run TestMigrationsApplyFromEmpty -v

  # One required check for branch protection, rather than a list that has to be
  # updated whenever a job is added or renamed.
  ci-success:
    name: CI
    if: always()
    needs: [web, accessibility, server, desktop, licences, vulnerabilities, migrations]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded or was skipped
        run: |
          # "skipped" is fine — that is the fast tier deliberately not running
          # the heavy jobs. "failure" and "cancelled" are not.
          results='${{ join(needs.*.result, " ") }}'
          echo "Job results: $results"

          for result in $results; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required job reported: $result"; exit 1 ;;
            esac
          done
