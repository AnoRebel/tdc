# Development tool versions.
#
# Pinned so that every contributor and every continuous integration run uses
# the same toolchain. Run "mise install" after cloning.
#
# These are exact versions rather than ranges: a toolchain that drifts between
# contributors produces failures that are hard to reproduce, and Wails v3 in
# particular ships near-daily beta builds where an unpinned "latest" can
# regress without warning.

[tools]
go = "1.27.0"
sqlc = "1.31.1"
air = "1.67.4"
golangci-lint = "2.13.1"
task = "3.53.1"
bun = "1.4.0"
